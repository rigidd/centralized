replicaCount: 1

image:
  repository: ghcr.io/rigidd/centralized
  pullPolicy: IfNotPresent
  # tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: centralized.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

readinessProbe:
  httpGet:
    path: /up
    port: 8000

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

existingSecret:
  enabled: false
  name: ""
  namespace: ""

env:


postgresql:
  enabled: true
  auth:
    username: "centralized"
    database: "centralized"
  primary:
    persistence:
      enabled: true
      size: "8Gi"