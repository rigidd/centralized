{{- if eq .Values.existingSecret.enabled false -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "centralized.fullname" . }}-app-key
type: Opaque
data:
  APP_KEY: {{
    if (lookup "v1" "Secret" .Release.Namespace (printf "%s-app-key" (include "centralized.fullname" .)))
    }}
      {{ (lookup "v1" "Secret" .Release.Namespace (printf "%s-app-key" (include "centralized.fullname" .))).data.APP_KEY }}
    {{
    else
    }}
      {{ printf "base64:%s" (randAlphaNum 32 | b64enc) | b64enc }}
    {{ end }}
{{ end }}