---
kind: pipeline
type: docker
name: merge-deploy

trigger:
  event:
    - push
    - custom
  branch:
    - main

platform:
  os: linux
  arch: arm64

depends_on:
  - build-amd64
  - build-arm64

steps:
  - name: merge-images
    image: docker:24.0.5
    environment:
      GITHUB_USERNAME:
        from_secret: GITHUB_USERNAME
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USERNAME" --password-stdin
      - docker buildx imagetools create
        --tag ghcr.io/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}:${DRONE_REPO_BRANCH}
        ghcr.io/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}:${DRONE_REPO_BRANCH}-amd64
        ghcr.io/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}:${DRONE_REPO_BRANCH}-arm64

      - if [ "${DRONE_REPO_BRANCH}" = "main" ]; then
          docker buildx imagetools create
            -t ghcr.io/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}:latest
            ghcr.io/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}:${DRONE_REPO_BRANCH}-amd64
            ghcr.io/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}:${DRONE_REPO_BRANCH}-arm64;
        fi

---
kind: pipeline
type: docker
name: deploy

trigger:
  event:
    - promote
  target:
    - production

platform:
  os: linux
  arch: amd64

steps:
  - name: deploy-to-rigidd
    image: curlimages/curl:8.18.0
    environment:
      ARGOCD_SERVER:
        from_secret: ARGOCD_SERVER
      ARGOCD_TOKEN:
        from_secret: ARGOCD_TOKEN
      APP_NAME:
        from_secret: ARGOCD_APP_NAME
      NAMESPACE:
        from_secret: ARGOCD_APP_NAMESPACE
      DEPLOYMENT_NAME:
        from_secret: ARGOCD_APP_DEPLOYMENT_NAME
    commands:
      - |
        curl -X POST \
          -H "Authorization: Bearer $ARGOCD_TOKEN" \
          -H "Content-Type: application/json" \
          -k \
          "https://$ARGOCD_SERVER/api/v1/applications/$APP_NAME/resource/actions" \
          -d '{
            "namespace": "'"$NAMESPACE"'",
            "resourceName": "'"$DEPLOYMENT_NAME"'",
            "kind": "Deployment",
            "group": "apps",
            "version": "v1",
            "action": "restart"
          }'