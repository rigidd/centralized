kind: pipeline
type: docker
name: build-amd64

trigger:
  event:
    - push
    - custom
  branch:
    - main

platform:
  os: linux
  arch: amd64

steps:
  - name: build
    image: plugins/docker
    settings:
      repo: ghcr.io/${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}
      tags:
        - ${DRONE_REPO_BRANCH}-amd64
      dockerfile: ./docker/prod/Dockerfile
      context: .
      build_args:
        - "BUILDKIT_INLINE_CACHE=1"
      buildx: false
      registry: ghcr.io
      username:
        from_secret: GITHUB_USERNAME
      password:
        from_secret: GITHUB_TOKEN

---
kind: pipeline
type: docker
name: build-arm64

trigger:
  event:
